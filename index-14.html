<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orayve – Small Details. Big Presence.</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#1C1B29',brass:'#B8905C',gold:'#D6B98C',bone:'#F3EFE7'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html{font-size:15px}body{font-family:'Manrope',sans-serif;background:#F3EFE7;color:#1C1B29}
.serif{font-family:'Fraunces',serif}
.ns::-webkit-scrollbar{display:none}.ns{scrollbar-width:none}
input,select{border:1px solid rgba(28,27,41,.2);border-radius:.5rem;padding:.5rem .75rem;font-size:.75rem;background:#fff}

@keyframes mqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.mq-t{display:flex;width:max-content;gap:.75rem;animation:mqR var(--d,70s) linear infinite}
.mq:hover .mq-t,.mq:focus-within .mq-t{animation-play-state:paused}
.tk-t{display:flex;width:max-content;animation:mqR 40s linear infinite}
.mq-s{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab}.mq-s::-webkit-scrollbar{display:none}.mq-s.drag{cursor:grabbing}.mq-s .mq-t{animation:none;gap:0}.ocard{margin-right:.75rem;position:relative;flex:0 0 auto;width:215px;height:150px;border-radius:.9rem;overflow:hidden;text-align:left;border:1px solid rgba(214,185,140,.35);background:#2E2B26;transition:transform .25s,box-shadow .25s}
.ocard:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.ocard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:transform .5s}
.ocard:hover img{transform:scale(1.1)}
.ocard:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,27,41,.1) 0%,rgba(28,27,41,.92) 100%);z-index:1}
.ocard>*:not(img){z-index:2}.ocard>span{position:absolute}
@media (prefers-reduced-motion:reduce){.mq-t,.tk-t{animation:none}.mq{overflow-x:auto}}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:fixed;inset:0;background:#fff;padding:24px}}
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-ink text-bone shadow-md">
  <div class="max-w-[1400px] mx-auto px-4 py-2 flex flex-wrap items-center gap-3 justify-between">
    <button data-a="home" class="serif text-xl tracking-wide flex items-center gap-2">
      <svg width="30" height="30" viewBox="0 0 64 64" fill="none"><circle cx="25" cy="32" r="16" stroke="#D6B98C" stroke-width="3.2"/><circle cx="39" cy="32" r="16" stroke="#F3EFE7" stroke-width="3.2"/></svg>Orayve
    </button>
    <input id="q" placeholder="Search 260 wallets, watches, shoes, ties, rings..." class="order-last sm:order-none flex-1 min-w-full sm:min-w-0 sm:max-w-md !bg-white/10 !border-brass/40 !rounded-full !px-4 text-bone placeholder-bone/50">
    <div class="flex items-center gap-2 text-xs font-semibold">
      <button data-a="onlyw" class="px-3 py-1.5 rounded-full border border-brass/40">♥ <span id="wc">0</span></button>
      <button data-a="drawer" class="px-3 py-1.5 rounded-full border border-brass/40">Bag <span id="cc">0</span></button>
      <button data-a="acct" id="ab" class="px-3 py-1.5 rounded-full border border-brass/40">Sign in</button>
      <button data-a="go" data-x="admin" class="px-3 py-1.5 rounded-full bg-brass/20 text-gold border border-brass/50">Admin</button>
      <div class="relative"><button data-a="menu" aria-label="More options" class="w-9 h-9 rounded-full border border-brass/40 text-lg leading-none">⋮</button><div id="menu"></div></div>
    </div>
  </div>
</header>
<div id="main"></div>
<footer id="ft" class="bg-ink text-bone pb-12 empty:hidden"></footer>
<div id="drawer"></div>
<div id="modal"></div>
<div id="fab"></div>
<div id="toast" class="fixed bottom-5 left-5 z-[60]"></div>

<script>
// ---------- CATALOG (13 categories x 20 = 260 products) ----------
const PRE='Savile Kensington Sovereign Verona Noir Heritage Regent Oslo Caspian Atelier Meridian Vanguard Imperial Valet Echelon Monolith Solstice Aurelia Celeste Bespoke'.split(' ');
const SW={L:[['Pitch Black','#1C1B29'],['Cognac Tan','#8B5A2B'],['Espresso','#4A3123']],G:[['Champagne Gold','#D6B98C'],['Rose Gold','#D49B8B'],['Polished Silver','#C0C5CE']],F:[['Ink Navy','#1F2D42'],['Burgundy','#5E2129'],['Emerald','#1E4D3B']]};
const CAT=[
['Wallets','42023120','WLT',899,'Leather Wallet',['Bifold','Slim Cardholder','Zip-Around','RFID Minimalist'],'L','1627123424574-724758594e93 1556742049-0cfed4f6a45d 1606503825008-909a67e63c3d 1591561954557-26941169b49e'],
["Men's Belts",'42033000','MBL',1199,'Leather Belt',['Formal Buckle','Reversible','Braided','Ratchet'],'L','1624222247344-550fb60583dc 1553062407-98eeb64c6a62 1590874103328-eac38a683ce7'],
['Bags & Backpacks','42029200','BAG',2499,'Bag',['Commuter Backpack','Laptop Briefcase','Weekender Duffle','Messenger'],'L','1553062407-98eeb64c6a62 1548036328-c9fa89d128fa 1622560480605-d83c853bc5c3 1581605405669-fcdf81165afa'],
['Handbags','42022290','HBG',2199,'Handbag',['Structured Tote','Top-Handle Sling','Evening Clutch','Crossbody'],'F','1584917865442-de89df76afd3 1590874103328-eac38a683ce7 1566150905458-1bf1fc113f0d'],
['Rings','71171990','RNG',549,'Ring',['Minimalist Band','Signet','Stackable','Solitaire'],'G','1605100804763-247f67b3557e 1603561591411-07134e71a2a9 1599643478518-a784e5dc4c8f'],
['Chains & Necklaces','71171910','CHN',799,'Chain',['Layered Link','Cuban Curb','Rope Chain','Pendant'],'G','1599643477877-530eb83abc8e 1611591437281-460bfbe1220a 1515562141207-7a88fb7ce338'],
['Shoes','64039990','SHO',3299,'Shoe',['Oxford Formal','Penny Loafer','Chelsea Boot','Minimal Sneaker'],'L','1614252235316-8c857d38b5f4 1549298916-b41d501d3772 1560769629-975ec94e6a86 1525966222134-fcfa99b8ae77'],
['Sandals','64039920','SND',1499,'Sandal',['Strappy Leather','Fisherman','Kolhapuri','Buckled Slide'],'L','1603487742131-4160ec999306 1562273138-f46be4ebdf33 1543163521-1bf539c55dd2'],
['Ladies Belts','42033000','LBL',849,'Waist Belt',['Skinny Brass','Waist Cinch','Chain Link','Corset'],'G','1553062407-98eeb64c6a62 1624222247344-550fb60583dc 1584917865442-de89df76afd3'],
['Ties','62151000','TIE',799,'Silk Tie',['Classic 8cm','Slim 6cm','Knitted','Jacquard Paisley'],'F','1589756823695-278bc923f962 1598033129183-c4f50c736f10 1507679799987-c73779587ccf'],
['Socks','61159500','SCK',399,'Socks',['Ribbed Dress','No-Show','Argyle','Cushioned'],'F','1586350977771-b3b0abd50c82 1582966772680-860e372bb558'],
['Ladies Wrist Watches','91021100','LWT',2899,'Ladies Watch',['Petite Mesh','Rectangular Tank','Bangle Dress','Minimalist Leather'],'G','1524805444758-089113d48a6d 1508685096489-7aacd43bd3b1 1539874754764-5a96559165b0'],
['Gents Wrist Watches','91021100','GWT',3499,'Gents Watch',['Chronograph','Automatic Diver','Dress Leather','Field Mechanical'],'F','1523275335684-37898b6baf30 1522312346375-d1a52e2b99b3 1614164185128-e4ec99c436d7 1587836374828-4dbafa94cf0e']
];
const P=[];let n=0;
CAT.forEach(([cat,hsn,sk,base,noun,sty,sw,ph],ci)=>{ph=ph.split(' ');
 for(let i=0;i<20;i++){n++;const price=base+(i%6)*150,d=20+(i*7)%21,mrp=Math.round(price/(1-d/100)),id='p'+n;
  P.push({id,title:`${PRE[i]} ${sty[i%4]} ${noun}`,cat,design:sty[i%4],hsn,rate:+(4.4+((ci+i)%7)*.1).toFixed(1),rev:24+(n*17)%210,views:450+(n*131)%2100,sold:i%5?35+(n*13)%140:12+i%8,coupon:i%6!==0,
   v:SW[sw].map(([c,h],k)=>({id:id+'v'+k,sku:`ORV-${sk}-${String(i+1).padStart(2,'0')}-${k+1}`,color:c,hex:h,photo:ph[(i+k)%ph.length],mrp:mrp+k*50,d,price:price+k*50,stock:(n+k*3)%14?18+(n*5+k*7)%48:6}))});}});
const COUP=[{code:'WELCOME15',type:'P',val:15,max:500,min:500,on:true},{code:'ORAYVE200',type:'F',val:200,max:200,min:999,on:true}];
const STAT=['ORDER PLACED','IN TRANSIT','OUT FOR DELIVERY','DELIVERED'];
const ADMIN_PASS='orayve@2026'; // demo only – client-side, NOT secure
const PAGE=24;

// ---------- STATE ----------
const $=s=>document.querySelector(s),inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem('orv_'+k))??d}catch{return d}};
const S={view:'store',q:'',cat:'All Categories',color:'All',sort:'featured',page:1,av:{},onlyW:false,drawer:false,
 users:ld('users',[]),user:ld('user',null),auth:null,after:0,pf:null,cf:null,uf:null,kf:null,menu:false,info:false,pimgs:[],rvAll:false,cart:ld('cart',[]),wish:ld('wish',[]),orders:ld('orders',[]),addrs:ld('addrs',[]),coupon:'',step:1,addr:null,pay:'UPI',last:null,inv:null,adm:false,atab:'analytics',aq:''};
const sv=()=>{try{['cart','wish','orders','addrs','users'].forEach(k=>localStorage.setItem('orv_'+k,JSON.stringify(S[k])));localStorage.setItem('orv_user',JSON.stringify(S.user))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svp=()=>{try{localStorage.setItem('orv_P',JSON.stringify(P));localStorage.setItem('orv_coupons',JSON.stringify(COUP));localStorage.setItem('orv_cats',JSON.stringify(CL))}catch{toast('Browser storage is full — remove some images or use smaller ones','e')}};
let CL=ld('cats',null)||CAT.map(c=>({name:c[0],hsn:c[1]}));
const CATS=()=>['All Categories',...CL.map(c=>c.name)];
const SP=ld('P',null);if(SP)P.splice(0,P.length,...SP);
const SC=ld('coupons',null);if(SC)COUP.splice(0,COUP.length,...SC);
{const cu=S.user&&S.users.find(u=>u.mobile===S.user.mobile);S.user=cu&&!cu.banned?cu:null}
const FB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="4" height="3" fill="#2E2B26"/><circle cx="1.8" cy="1.5" r=".6" fill="none" stroke="#D6B98C" stroke-width=".08"/><circle cx="2.2" cy="1.5" r=".6" fill="none" stroke="#F3EFE7" stroke-width=".08"/></svg>');
const img=v=>`<img loading="lazy" src="${!v.photo?FB:/^(http|data:)/.test(v.photo)?v.photo:'https://images.unsplash.com/photo-'+v.photo+'?auto=format&fit=crop&w=600&q=80'}" onerror="this.onerror=null;this.src=FB" class="w-full h-full object-cover" alt="">`;
const toast=(m,e)=>{$('#toast').innerHTML=`<div class="px-4 py-3 rounded-xl shadow-xl text-xs font-bold ${e?'bg-rose-700 text-white':'bg-ink text-gold border border-brass/50'}">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',2800)};
const av=p=>p.v[S.av[p.id]||0];
function cd(){const items=S.cart.map(c=>{const p=P.find(x=>x.id===c.pid);if(!p)return null;return{p,v:p.v.find(v=>v.id===c.vid)||p.v[0],q:c.q}}).filter(Boolean);
 const sub=items.reduce((s,i)=>s+i.v.price*i.q,0),el=items.reduce((s,i)=>i.p.coupon?s+i.v.price*i.q:s,0);let disc=0;
 const c=COUP.find(c=>c.code===S.coupon&&c.on);if(c&&el>=c.min)disc=c.type==='P'?Math.min(Math.round(el*c.val/100),c.max):Math.min(c.val,el);
 return{items,sub,disc,total:sub-disc,count:items.reduce((s,i)=>s+i.q,0)}}
function hdr(){$('#ab').textContent=S.user?'👤 '+S.user.name.split(' ')[0]:'Sign in / Register';$('#wc').textContent=S.wish.length;$('#cc').textContent=cd().count;fab()}

// ---------- VIEWS ----------

const OFFERS={'Wallets':['Buy 2, Get 10% Extra','🔥 Bestseller'],"Men's Belts":['Combo: Belt + Wallet −15%','🎁 Gift Combo'],'Bags & Backpacks':['Free Shipping + Extra ₹200','🚚 Free Delivery'],'Handbags':['Festive Edit · Limited Stock','✨ Festive'],'Rings':['Buy 1 Get 1 at 50%','💍 BOGO'],'Chains & Necklaces':['Layer Up · Extra 10% Off','✨ Trending'],'Shoes':['Footwear Fest · Flat ₹300 Off','👟 Mega Deal'],'Sandals':['Summer Steals · From ₹1,499','☀️ Hot Pick'],'Ladies Belts':['Style Under ₹999','💛 Value'],'Ties':['3 Ties for ₹1,999','🎯 Bundle'],'Socks':['Pack of 3 · Save 25%','🧦 Pack Deal'],'Ladies Wrist Watches':['Gifting Special · Free Gift Box','🎁 Gift Ready'],'Gents Wrist Watches':['Chronograph Sale · Top Rated','⌚ Top Rated']};
function offerBar(){
 const cp=COUP.filter(c=>c.on).map(c=>`<b class=\"text-ink bg-gold px-2 py-0.5 rounded\">${c.code}</b> ${c.type==='P'?c.val+'% off (up to '+inr(c.max)+')':inr(c.val)+' off'} on orders above ${inr(c.min)}`);
 const items=[...cp,'🚚 7-Day Return &amp; Replacement','🔥 Up to 40% OFF across 13 collections','🎁 Free gift packaging on watches &amp; rings','✨ New offers added every week'];
 const row=items.map(t=>`<span class=\"mx-6 text-[11px] font-semibold whitespace-nowrap\">${t}</span><span class=\"text-gold\">◆</span>`).join('');
 return `<div class=\"mq bg-brass/15 border-y border-brass/30 py-1.5\"><div class=\"tk-t\">${row}${row}</div></div>`}
function offerCarousel(){
 const cards=CL.map(c=>{const ps=P.filter(p=>p.cat===c.name);if(!ps.length)return'';
  const mx=Math.max(...ps.map(p=>Math.max(...p.v.map(v=>v.d)))),mn=Math.min(...ps.map(p=>Math.min(...p.v.map(v=>v.price)))),o=OFFERS[c.name]||['Special Offer Inside','🔥 Deal'],v=ps[0].v[0];
  return `<button data-a=\"cat\" data-x=\"${esc(c.name)}\" class=\"ocard\" aria-label=\"${esc(c.name)} offers\">${img(v)}
   <span class=\"absolute top-2 left-2 px-2 py-0.5 rounded-full bg-brass text-ink text-[10px] font-extrabold\">UP TO ${mx}% OFF</span>
   <span class=\"absolute top-2 right-2 px-2 py-0.5 rounded-full bg-ink/80 text-gold text-[9px] font-bold\">${o[1]}</span>
   <span class=\"absolute left-2 right-2 block text-center\" style=\"top:62%;transform:translateY(-50%);text-align:center\"><span class=\"serif block text-sm text-bone leading-tight\">${esc(c.name)}</span><span class=\"block text-[10px] text-gold font-semibold\">${o[0]}</span><span class=\"block text-[10px] text-bone/70\">Starting ${inr(mn)} · Shop now →</span></span></button>`}).join('');
 return `<div class=\"mq mt-4\"><div class=\"mq-s\" id=\"ocar\"><div class=\"mq-t\">${cards}${cards}</div></div></div>`}
function store(){
 const scope=S.cat==='All Categories'?P:P.filter(p=>p.cat===S.cat),colors=['All',...new Set(scope.flatMap(p=>p.v.map(v=>v.color)))];
 const q=S.q.trim().toLowerCase();
 let L=P.filter(p=>(S.cat==='All Categories'||p.cat===S.cat)&&(!q||(p.title+p.cat+p.design).toLowerCase().includes(q))&&(S.color==='All'||p.v.some(v=>v.color===S.color))&&(!S.onlyW||S.wish.includes(p.id)));
 if(S.sort==='rating')L=[...L].sort((a,b)=>b.rate-a.rate);
 if(S.sort==='asc')L=[...L].sort((a,b)=>av(a).price-av(b).price);
 if(S.sort==='desc')L=[...L].sort((a,b)=>av(b).price-av(a).price);
 const tp=Math.max(1,Math.ceil(L.length/PAGE)),pg=Math.min(S.page,tp),rows=L.slice((pg-1)*PAGE,pg*PAGE);
 const cnt=c=>c==='All Categories'?P.length:P.filter(p=>p.cat===c).length;
 return `<section class="bg-ink text-bone">${offerBar()}<div class="max-w-[1400px] mx-auto px-4 py-5">
  <p class="text-[11px] uppercase tracking-[.28em] text-gold font-bold">Small Details. Big Presence.</p>
  <h1 class="serif text-xl sm:text-3xl font-medium mt-1 max-w-2xl">260 curated essentials across 13 signature collections.</h1>
  <p class="text-xs text-bone/75 mt-1.5 max-w-xl">Wallets, belts, bags, watches, footwear, ties, rings and more — each backed by our 7-day return &amp; replacement guarantee.</p>
  </div>${offerCarousel()}<div class="max-w-[1400px] mx-auto px-4 pb-4"><div id="pills" class="flex gap-2 overflow-x-auto ns pt-4">${CATS().map(c=>`<button data-a="cat" data-x="${esc(c)}" class="shrink-0 px-3 py-1 rounded-full text-[11px] font-medium ${S.cat===c?'bg-brass text-ink font-bold':'bg-white/5 border border-white/15'}">${c} (${cnt(c)})</button>`).join('')}</div></div></section>
 <section class="max-w-[1400px] mx-auto px-4 py-4">
  <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-ink/10">
   <div><h2 class="serif text-lg">${S.onlyW?'Wishlist':S.cat}</h2><p class="text-xs text-ink/60">${L.length?`Showing ${(pg-1)*PAGE+1}–${Math.min(pg*PAGE,L.length)} of ${L.length}`:'0'} products</p></div>
   <div class="flex gap-2"><select data-c="color">${colors.map(c=>`<option ${c===S.color?'selected':''} value="${c}">${c==='All'?'Color: All':c}</option>`).join('')}</select>
   <select data-c="sort">${[['featured','Featured'],['rating','Top Rated'],['asc','Price: Low–High'],['desc','Price: High–Low']].map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
  ${rows.length?`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3 sm:gap-4 mt-4">${rows.map(card).join('')}</div>`:'<p class="py-20 text-center text-ink/60">No products match your search.</p>'}
  ${tp>1?`<div class="mt-6 flex items-center justify-center gap-3 text-xs font-bold"><button ${pg===1?'disabled':''} data-a="page" data-x="${pg-1}" class="px-4 py-2 rounded-lg border bg-white disabled:opacity-40">‹ Prev</button>Page ${pg} of ${tp}<button ${pg===tp?'disabled':''} data-a="page" data-x="${pg+1}" class="px-4 py-2 rounded-lg border bg-white disabled:opacity-40">Next ›</button></div>`:''}</section>`}
function card(p){const v=av(p),w=S.wish.includes(p.id),cq=S.cart.find(c=>c.vid===v.id)?.q||0,inC=cq>0;
 return `<div class="bg-white rounded-xl border border-ink/10 overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col">
 <div data-a="open" data-x="${p.id}" class="relative h-44 bg-ink cursor-pointer"><div class="w-full h-full ${v.stock<1?'grayscale':''}">${img(v)}</div>${v.stock<1?'<span class="absolute inset-x-0 bottom-5 mx-auto w-fit px-3 py-1 rounded bg-ink/85 text-bone text-xs font-bold">Out of stock</span>':''}<div class="absolute bottom-0 inset-x-0 h-1" style="background:${v.hex}"></div>
  <div class="absolute top-3 left-3 flex flex-col gap-1.5"><span class="px-2 py-0.5 rounded bg-brass text-ink text-[10px] font-bold">${v.d}% OFF</span>${p.coupon?'<span class="px-2 py-0.5 rounded bg-ink/85 text-gold text-[10px] font-semibold">Coupon Eligible</span>':''}</div>
  <div class="absolute top-3 right-3 flex flex-col gap-1.5"><button data-a="wish" data-x="${p.id}" class="w-7 h-7 rounded-full bg-ink/75 text-bone ${w?'!text-gold':''}">${w?'♥':'♡'}</button><button data-a="share" data-x="${p.id}" class="w-7 h-7 rounded-full bg-ink/75 text-bone text-xs">⇪</button></div></div>
 <div class="p-3 flex-1 flex flex-col"><div class="flex items-center justify-between mb-1.5"><div class="flex gap-1.5">${p.v.map((x,i)=>`<button data-a="sw" data-x="${p.id}" data-y="${i}" title="${x.color}" class="w-4 h-4 rounded-full border border-ink/30 ${x.id===v.id?'ring-2 ring-offset-1 ring-brass':''}" style="background:${x.hex}"></button>`).join('')}</div><span class="text-[11px] text-ink/60">${v.color}</span></div>
  <p class="text-[10px] uppercase tracking-wider text-brass font-bold">${p.cat} · ${p.design}</p>
  <h3 data-a="open" data-x="${p.id}" class="serif text-sm mt-0.5 line-clamp-1 cursor-pointer hover:text-brass">${p.title}</h3>
  <div class="flex justify-between gap-2 mt-1.5 text-xs"><span class="font-semibold">★ ${p.rate} <span class="text-ink/50 font-normal">(${p.rev})</span></span><span class="font-semibold text-right ${sk(v)[1]}">${sk(v)[0]}</span></div>
  <div class="mt-auto pt-2 flex flex-wrap items-center justify-between gap-1"><div><span class="text-base font-bold">${inr(v.price)}</span> <span class="text-xs line-through text-ink/45">${inr(v.mrp)}</span><p class="text-[10px] text-ink/50">SKU: ${v.sku}</p></div>
  ${v.stock<1?`<button disabled class="px-3 py-1.5 rounded-lg bg-ink/15 text-ink/50 text-xs font-semibold cursor-not-allowed">Sold out</button>`:inC?stp(p.id,v.id,cq):`<button data-a="add" data-x="${p.id}" class="px-3 py-1.5 rounded-lg bg-ink text-bone hover:bg-brass hover:text-ink text-xs font-semibold">Add</button>`}</div></div></div>`}

function checkout(){const c=cd();

// ---------- CAROUSEL: auto left→right, pause on hover, wheel/drag scroll, resume on leave ----------
(()=>{let hov=false,drag=false,sx=0,sl=0,last=0,el=null;
 const half=e=>{const k=e.firstElementChild.children;return k.length>1?k[k.length/2].offsetLeft-k[0].offsetLeft:0};
 const wrap=e=>{const h=half(e);if(!h)return;if(e.scrollLeft<=0)e.scrollLeft+=h;else if(e.scrollLeft>=h*2-e.clientWidth)e.scrollLeft-=h};
 document.addEventListener('mouseover',e=>{if(e.target.closest&&e.target.closest('#ocar'))hov=true});
 document.addEventListener('mouseout',e=>{const t=e.relatedTarget;if(!t||!t.closest||!t.closest('#ocar')){hov=false;drag=false;const c=$('#ocar');if(c)c.classList.remove('drag')}});
 document.addEventListener('wheel',e=>{const c=e.target.closest&&e.target.closest('#ocar');if(!c)return;e.preventDefault();c.scrollLeft+=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;wrap(c)},{passive:false});
 document.addEventListener('mousedown',e=>{const c=e.target.closest&&e.target.closest('#ocar');if(!c)return;drag=true;sx=e.clientX;sl=c.scrollLeft;c.classList.add('drag')});
 document.addEventListener('mousemove',e=>{if(!drag)return;const c=$('#ocar');if(c){c.scrollLeft=sl-(e.clientX-sx);wrap(c)}});
 document.addEventListener('mouseup',()=>{drag=false;const c=$('#ocar');if(c)c.classList.remove('drag')});
 document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('#ocar'))hov=true},{passive:true});
 document.addEventListener('touchend',()=>setTimeout(()=>hov=false,1500),{passive:true});
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 function tick(t){const c=$('#ocar');
  if(c!==el){el=c;if(c){const h=half(c);if(h)c.scrollLeft=h}}
  if(c&&!hov&&!drag&&!reduce){const dt=Math.min(50,t-last||16);c.scrollLeft-=dt*0.04;wrap(c)}
  last=t;requestAnimationFrame(tick)}
 requestAnimationFrame(tick)})();
</script>
