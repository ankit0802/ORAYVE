<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='25' cy='32' r='16' stroke='%23D6B98C' stroke-width='4' fill='none'/><circle cx='39' cy='32' r='16' stroke='%231C1B29' stroke-width='4' fill='none'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORAYVE — Small Details. Big Presence.</title>
    <meta name="description" content="ORAYVE — Premium curated accessories, jewelry, handcrafted leather wallets, timepieces, and gift sets." />
    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="ORAYVE — Small Details. Big Presence." />
    <meta property="og:description" content="Luxury accessories crafted for modern sophistication." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Zero-Subscription Netlify Drawer & Badge Neutralizer -->
    <style>
      #nl-hud-frame, #nl-badge-frame, netlify-drawer, iframe[src*="netlify"], iframe[title*="Netlify"], div[class*="netlify"], div[id*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      (function() {
        // Preemptively exit Netlify's HUD script before it can render
        const defuse = function() {
          const s = document.querySelector('script[data-nf-variant]');
          if (s) {
            delete s.dataset.nfVariant;
            s.remove();
          }
          document.querySelectorAll('iframe[src*="netlify"], iframe[title*="Netlify"], netlify-drawer').forEach(function(el) {
            el.remove();
          });
        };
        defuse();
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(defuse).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-[#F3EFE7] text-[#1C1B29] antialiased">
    <!-- Sentinel elements: causes Netlify HUD to execute 'return' and abort -->
    <div id="nl-hud-frame" style="display:none!important;width:0!important;height:0!important;"></div>
    <div id="nl-badge-frame" style="display:none!important;width:0!important;height:0!important;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
