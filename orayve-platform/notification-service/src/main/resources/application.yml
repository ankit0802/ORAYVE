server:
  port: 8084

spring:
  application:
    name: notification-service
  datasource:
    url: ${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/orayve_db?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: notif_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:notifications@orayve.in}
    password: ${MAIL_PASSWORD:orayve_mail_secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
