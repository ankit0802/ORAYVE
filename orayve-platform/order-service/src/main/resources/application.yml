server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/orayve_db?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: order_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_orayve_demo}
  key-secret: ${RAZORPAY_KEY_SECRET:orayve_demo_secret}
