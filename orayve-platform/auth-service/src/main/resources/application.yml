server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${NEON_DATABASE_URL:jdbc:postgresql://localhost:5432/orayve_db?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas:
      - auth_schema
      - catalog_schema
      - order_schema
      - notif_schema
    default-schema: auth_schema
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: auth_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:orayve-super-secret-jwt-key-2026-change-in-prod}
  expiration: 604800000 # 7 days
