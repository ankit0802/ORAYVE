<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orayve – Small Details. Big Presence.</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#1C1B29',brass:'#B8905C',gold:'#D6B98C',bone:'#F3EFE7'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Manrope',sans-serif;background:#F3EFE7;color:#1C1B29}
.serif{font-family:'Fraunces',serif}
.ns::-webkit-scrollbar{display:none}.ns{scrollbar-width:none}
input,select{border:1px solid rgba(28,27,41,.2);border-radius:.5rem;padding:.5rem .75rem;font-size:.75rem;background:#fff}
@media print{body *{visibility:hidden}#inv,#inv *{visibility:visible}#inv{position:fixed;inset:0;background:#fff;padding:24px}}
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-ink text-bone shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3 justify-between">
    <button data-a="cat" data-x="All Categories" class="serif text-2xl tracking-wide flex items-center gap-2">
      <svg width="30" height="30" viewBox="0 0 64 64" fill="none"><circle cx="25" cy="32" r="16" stroke="#D6B98C" stroke-width="3.2"/><circle cx="39" cy="32" r="16" stroke="#F3EFE7" stroke-width="3.2"/></svg>Orayve
    </button>
    <input id="q" placeholder="Search 260 wallets, watches, shoes, ties, rings..." class="order-last sm:order-none flex-1 min-w-full sm:min-w-0 sm:max-w-md !bg-white/10 !border-brass/40 !rounded-full !px-4 text-bone placeholder-bone/50">
    <div class="flex items-center gap-2 text-xs font-semibold">
      <button data-a="onlyw" class="px-3 py-1.5 rounded-full border border-brass/40">♥ <span id="wc">0</span></button>
      <button data-a="drawer" class="px-3 py-1.5 rounded-full border border-brass/40">Bag <span id="cc">0</span></button>
      <button data-a="acct" id="ab" class="px-3 py-1.5 rounded-full border border-brass/40">Sign in</button>
      <button data-a="go" data-x="admin" class="px-3 py-1.5 rounded-full bg-brass/20 text-gold border border-brass/50">Admin</button>
    </div>
  </div>
</header>
<div id="main"></div>
<div id="drawer"></div>
<div id="modal"></div>
<div id="toast" class="fixed bottom-5 right-5 z-[60]"></div>

<script>
// ---------- CATALOG (13 categories x 20 = 260 products) ----------
const PRE='Savile Kensington Sovereign Verona Noir Heritage Regent Oslo Caspian Atelier Meridian Vanguard Imperial Valet Echelon Monolith Solstice Aurelia Celeste Bespoke'.split(' ');
const SW={L:[['Pitch Black','#1C1B29'],['Cognac Tan','#8B5A2B'],['Espresso','#4A3123']],G:[['Champagne Gold','#D6B98C'],['Rose Gold','#D49B8B'],['Polished Silver','#C0C5CE']],F:[['Ink Navy','#1F2D42'],['Burgundy','#5E2129'],['Emerald','#1E4D3B']]};
const CAT=[
['Wallets','42023120','WLT',899,'Leather Wallet',['Bifold','Slim Cardholder','Zip-Around','RFID Minimalist'],'L','1627123424574-724758594e93 1556742049-0cfed4f6a45d 1606503825008-909a67e63c3d 1591561954557-26941169b49e'],
["Men's Belts",'42033000','MBL',1199,'Leather Belt',['Formal Buckle','Reversible','Braided','Ratchet'],'L','1624222247344-550fb60583dc 1553062407-98eeb64c6a62 1590874103328-eac38a683ce7'],
['Bags & Backpacks','42029200','BAG',2499,'Bag',['Commuter Backpack','Laptop Briefcase','Weekender Duffle','Messenger'],'L','1553062407-98eeb64c6a62 1548036328-c9fa89d128fa 1622560480605-d83c853bc5c3 1581605405669-fcdf81165afa'],
['Handbags','42022290','HBG',2199,'Handbag',['Structured Tote','Top-Handle Sling','Evening Clutch','Crossbody'],'F','1584917865442-de89df76afd3 1590874103328-eac38a683ce7 1566150905458-1bf1fc113f0d'],
['Rings','71171990','RNG',549,'Ring',['Minimalist Band','Signet','Stackable','Solitaire'],'G','1605100804763-247f67b3557e 1603561591411-07134e71a2a9 1599643478518-a784e5dc4c8f'],
['Chains & Necklaces','71171910','CHN',799,'Chain',['Layered Link','Cuban Curb','Rope Chain','Pendant'],'G','1599643477877-530eb83abc8e 1611591437281-460bfbe1220a 1515562141207-7a88fb7ce338'],
['Shoes','64039990','SHO',3299,'Shoe',['Oxford Formal','Penny Loafer','Chelsea Boot','Minimal Sneaker'],'L','1614252235316-8c857d38b5f4 1549298916-b41d501d3772 1560769629-975ec94e6a86 1525966222134-fcfa99b8ae77'],
['Sandals','64039920','SND',1499,'Sandal',['Strappy Leather','Fisherman','Kolhapuri','Buckled Slide'],'L','1603487742131-4160ec999306 1562273138-f46be4ebdf33 1543163521-1bf539c55dd2'],
['Ladies Belts','42033000','LBL',849,'Waist Belt',['Skinny Brass','Waist Cinch','Chain Link','Corset'],'G','1553062407-98eeb64c6a62 1624222247344-550fb60583dc 1584917865442-de89df76afd3'],
['Ties','62151000','TIE',799,'Silk Tie',['Classic 8cm','Slim 6cm','Knitted','Jacquard Paisley'],'F','1589756823695-278bc923f962 1598033129183-c4f50c736f10 1507679799987-c73779587ccf'],
['Socks','61159500','SCK',399,'Socks',['Ribbed Dress','No-Show','Argyle','Cushioned'],'F','1586350977771-b3b0abd50c82 1582966772680-860e372bb558'],
['Ladies Wrist Watches','91021100','LWT',2899,'Ladies Watch',['Petite Mesh','Rectangular Tank','Bangle Dress','Minimalist Leather'],'G','1524805444758-089113d48a6d 1508685096489-7aacd43bd3b1 1539874754764-5a96559165b0'],
['Gents Wrist Watches','91021100','GWT',3499,'Gents Watch',['Chronograph','Automatic Diver','Dress Leather','Field Mechanical'],'F','1523275335684-37898b6baf30 1522312346375-d1a52e2b99b3 1614164185128-e4ec99c436d7 1587836374828-4dbafa94cf0e']
];
const P=[];let n=0;
CAT.forEach(([cat,hsn,sk,base,noun,sty,sw,ph],ci)=>{ph=ph.split(' ');
 for(let i=0;i<20;i++){n++;const price=base+(i%6)*150,d=20+(i*7)%21,mrp=Math.round(price/(1-d/100)),id='p'+n;
  P.push({id,title:`${PRE[i]} ${sty[i%4]} ${noun}`,cat,design:sty[i%4],hsn,rate:+(4.4+((ci+i)%7)*.1).toFixed(1),rev:24+(n*17)%210,views:450+(n*131)%2100,sold:i%5?35+(n*13)%140:12+i%8,coupon:i%6!==0,
   v:SW[sw].map(([c,h],k)=>({id:id+'v'+k,sku:`ORV-${sk}-${String(i+1).padStart(2,'0')}-${k+1}`,color:c,hex:h,photo:ph[(i+k)%ph.length],mrp:mrp+k*50,d,price:price+k*50,stock:(n+k*3)%14?18+(n*5+k*7)%48:6}))});}});
const COUP=[{code:'WELCOME15',type:'P',val:15,max:500,min:500,on:true},{code:'ORAYVE200',type:'F',val:200,max:200,min:999,on:true}];
const STAT=['ORDER PLACED','IN TRANSIT','OUT FOR DELIVERY','DELIVERED'];
const ADMIN_PASS='orayve@2026'; // demo only – client-side, NOT secure
const PAGE=24;

// ---------- STATE ----------
const $=s=>document.querySelector(s),inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem('orv_'+k))??d}catch{return d}};
const S={view:'store',q:'',cat:'All Categories',color:'All',sort:'featured',page:1,av:{},onlyW:false,drawer:false,
 users:ld('users',[]),user:ld('user',null),auth:null,after:0,pf:null,cf:null,uf:null,kf:null,cart:ld('cart',[]),wish:ld('wish',[]),orders:ld('orders',[]),addrs:ld('addrs',[]),coupon:'',step:1,addr:null,pay:'UPI',last:null,inv:null,adm:false,atab:'analytics',aq:''};
const sv=()=>{try{['cart','wish','orders','addrs','users'].forEach(k=>localStorage.setItem('orv_'+k,JSON.stringify(S[k])));localStorage.setItem('orv_user',JSON.stringify(S.user))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svp=()=>{try{localStorage.setItem('orv_P',JSON.stringify(P));localStorage.setItem('orv_coupons',JSON.stringify(COUP));localStorage.setItem('orv_cats',JSON.stringify(CL))}catch{}};
let CL=ld('cats',null)||CAT.map(c=>({name:c[0],hsn:c[1]}));
const CATS=()=>['All Categories',...CL.map(c=>c.name)];
const SP=ld('P',null);if(SP)P.splice(0,P.length,...SP);
const SC=ld('coupons',null);if(SC)COUP.splice(0,COUP.length,...SC);
{const cu=S.user&&S.users.find(u=>u.mobile===S.user.mobile);S.user=cu&&!cu.banned?cu:null}
const FB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4 3"><rect width="4" height="3" fill="#2E2B26"/><circle cx="1.8" cy="1.5" r=".6" fill="none" stroke="#D6B98C" stroke-width=".08"/><circle cx="2.2" cy="1.5" r=".6" fill="none" stroke="#F3EFE7" stroke-width=".08"/></svg>');
const img=v=>`<img loading="lazy" src="${!v.photo?FB:/^(http|data:)/.test(v.photo)?v.photo:'https://images.unsplash.com/photo-'+v.photo+'?auto=format&fit=crop&w=600&q=80'}" onerror="this.onerror=null;this.src=FB" class="w-full h-full object-cover" alt="">`;
const toast=(m,e)=>{$('#toast').innerHTML=`<div class="px-4 py-3 rounded-xl shadow-xl text-xs font-bold ${e?'bg-rose-700 text-white':'bg-ink text-gold border border-brass/50'}">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',2800)};
const av=p=>p.v[S.av[p.id]||0];
function cd(){const items=S.cart.map(c=>{const p=P.find(x=>x.id===c.pid);if(!p)return null;return{p,v:p.v.find(v=>v.id===c.vid)||p.v[0],q:c.q}}).filter(Boolean);
 const sub=items.reduce((s,i)=>s+i.v.price*i.q,0),el=items.reduce((s,i)=>i.p.coupon?s+i.v.price*i.q:s,0);let disc=0;
 const c=COUP.find(c=>c.code===S.coupon&&c.on);if(c&&el>=c.min)disc=c.type==='P'?Math.min(Math.round(el*c.val/100),c.max):Math.min(c.val,el);
 return{items,sub,disc,total:sub-disc,count:items.reduce((s,i)=>s+i.q,0)}}
function hdr(){$('#ab').textContent=S.user?'👤 '+S.user.name.split(' ')[0]:'Sign in / Register';$('#wc').textContent=S.wish.length;$('#cc').textContent=cd().count}

// ---------- VIEWS ----------
function store(){
 const scope=S.cat==='All Categories'?P:P.filter(p=>p.cat===S.cat),colors=['All',...new Set(scope.flatMap(p=>p.v.map(v=>v.color)))];
 const q=S.q.trim().toLowerCase();
 let L=P.filter(p=>(S.cat==='All Categories'||p.cat===S.cat)&&(!q||(p.title+p.cat+p.design).toLowerCase().includes(q))&&(S.color==='All'||p.v.some(v=>v.color===S.color))&&(!S.onlyW||S.wish.includes(p.id)));
 if(S.sort==='rating')L=[...L].sort((a,b)=>b.rate-a.rate);
 if(S.sort==='asc')L=[...L].sort((a,b)=>av(a).price-av(b).price);
 if(S.sort==='desc')L=[...L].sort((a,b)=>av(b).price-av(a).price);
 const tp=Math.max(1,Math.ceil(L.length/PAGE)),pg=Math.min(S.page,tp),rows=L.slice((pg-1)*PAGE,pg*PAGE);
 const cnt=c=>c==='All Categories'?P.length:P.filter(p=>p.cat===c).length;
 return `<section class="bg-ink text-bone"><div class="max-w-7xl mx-auto px-4 py-10">
  <p class="text-[11px] uppercase tracking-[.28em] text-gold font-bold">Small Details. Big Presence.</p>
  <h1 class="serif text-3xl sm:text-5xl font-medium mt-2 max-w-2xl">260 curated essentials across 13 signature collections.</h1>
  <p class="text-sm text-bone/75 mt-3 max-w-xl">Wallets, belts, bags, watches, footwear, ties, rings and more — each backed by our 7-day return &amp; replacement guarantee.</p>
  <div class="flex gap-2 overflow-x-auto ns pt-6">${CATS().map(c=>`<button data-a="cat" data-x="${esc(c)}" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium ${S.cat===c?'bg-brass text-ink font-bold':'bg-white/5 border border-white/15'}">${c} (${cnt(c)})</button>`).join('')}</div></div></section>
 <section class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex flex-wrap items-center justify-between gap-3 pb-5 border-b border-ink/10">
   <div><h2 class="serif text-2xl">${S.onlyW?'Wishlist':S.cat}</h2><p class="text-xs text-ink/60">${L.length?`Showing ${(pg-1)*PAGE+1}–${Math.min(pg*PAGE,L.length)} of ${L.length}`:'0'} products</p></div>
   <div class="flex gap-2"><select data-c="color">${colors.map(c=>`<option ${c===S.color?'selected':''} value="${c}">${c==='All'?'Color: All':c}</option>`).join('')}</select>
   <select data-c="sort">${[['featured','Featured'],['rating','Top Rated'],['asc','Price: Low–High'],['desc','Price: High–Low']].map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
  ${rows.length?`<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-7">${rows.map(card).join('')}</div>`:'<p class="py-20 text-center text-ink/60">No products match your search.</p>'}
  ${tp>1?`<div class="mt-10 flex items-center justify-center gap-3 text-xs font-bold"><button ${pg===1?'disabled':''} data-a="page" data-x="${pg-1}" class="px-4 py-2 rounded-lg border bg-white disabled:opacity-40">‹ Prev</button>Page ${pg} of ${tp}<button ${pg===tp?'disabled':''} data-a="page" data-x="${pg+1}" class="px-4 py-2 rounded-lg border bg-white disabled:opacity-40">Next ›</button></div>`:''}</section>`}
function card(p){const v=av(p),w=S.wish.includes(p.id);
 return `<div class="bg-white rounded-xl border border-ink/10 overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col">
 <div class="relative h-60 bg-ink">${img(v)}<div class="absolute bottom-0 inset-x-0 h-1" style="background:${v.hex}"></div>
  <div class="absolute top-3 left-3 flex flex-col gap-1.5"><span class="px-2 py-0.5 rounded bg-brass text-ink text-[10px] font-bold">${v.d}% OFF</span>${p.coupon?'<span class="px-2 py-0.5 rounded bg-ink/85 text-gold text-[10px] font-semibold">Coupon Eligible</span>':''}</div>
  <div class="absolute top-3 right-3 flex flex-col gap-1.5"><button data-a="wish" data-x="${p.id}" class="w-8 h-8 rounded-full bg-ink/75 text-bone ${w?'!text-gold':''}">${w?'♥':'♡'}</button><button data-a="share" data-x="${p.id}" class="w-8 h-8 rounded-full bg-ink/75 text-bone text-xs">⇪</button></div></div>
 <div class="p-4 flex-1 flex flex-col"><div class="flex items-center justify-between mb-2"><div class="flex gap-1.5">${p.v.map((x,i)=>`<button data-a="sw" data-x="${p.id}" data-y="${i}" title="${x.color}" class="w-5 h-5 rounded-full border border-ink/30 ${x.id===v.id?'ring-2 ring-offset-1 ring-brass':''}" style="background:${x.hex}"></button>`).join('')}</div><span class="text-[11px] text-ink/60">${v.color}</span></div>
  <p class="text-[10px] uppercase tracking-wider text-brass font-bold">${p.cat} · ${p.design}</p>
  <h3 class="serif text-base mt-1 line-clamp-1">${p.title}</h3>
  <div class="flex justify-between mt-1.5 text-xs"><span class="font-semibold">★ ${p.rate} <span class="text-ink/50 font-normal">(${p.rev})</span></span><span class="font-semibold ${v.stock<=10?'text-amber-700':'text-emerald-700'}">${v.stock} in stock</span></div>
  <div class="mt-auto pt-4 flex items-center justify-between"><div><span class="text-lg font-bold">${inr(v.price)}</span> <span class="text-xs line-through text-ink/45">${inr(v.mrp)}</span><p class="text-[10px] text-ink/50">SKU: ${v.sku}</p></div>
  <button data-a="add" data-x="${p.id}" class="px-3.5 py-2 rounded-lg bg-ink text-bone hover:bg-brass hover:text-ink text-xs font-semibold">Add</button></div></div></div>`}

function checkout(){const c=cd();
 const steps=['Address','Payment','Confirmed'].map((l,i)=>`<span class="text-xs font-bold ${S.step>=i+1?'':'opacity-40'}">${i+1}. ${l}</span>`).join(' <span class="opacity-30">—</span> ');
 let body='';
 if(S.step===3&&S.last){const o=S.last;body=`<div class="max-w-xl mx-auto bg-white rounded-2xl border border-brass/40 p-8 text-center shadow-lg"><p class="text-4xl">✅</p><p class="text-[11px] uppercase tracking-[.25em] text-brass font-bold mt-2">Order Confirmed</p><h2 class="serif text-3xl mt-1">Thank you for choosing Orayve</h2><p class="text-sm mt-2">Order ID: <b>${o.id}</b></p><p class="text-xs text-ink/60 mt-1">Protected by our 7-Day Return &amp; Replacement Policy</p><div class="mt-6 flex justify-center gap-3"><button data-a="invoice" data-x="${o.id}" class="px-5 py-2.5 rounded-xl bg-ink text-bone text-xs font-bold">GST Invoice</button><button data-a="go" data-x="orders" class="px-5 py-2.5 rounded-xl border border-ink/25 text-xs font-bold">Order History</button></div></div>`}
 else if(!c.items.length)body='<p class="text-center py-20">Your bag is empty.</p>';
 else if(S.step===1){body=`<div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-2 space-y-4"><h2 class="serif text-2xl">Delivery Address</h2>
  ${S.addrs.filter(a=>a.m===S.user.mobile).map(a=>`<div data-a="addr" data-x="${a.id}" class="p-4 rounded-xl border bg-white cursor-pointer ${S.addr===a.id?'border-brass ring-2 ring-brass/25':'border-ink/15'}"><b class="text-sm">${a.name}</b> <span class="text-xs text-ink/60">${a.phone}</span><p class="text-xs mt-1">${a.street}, ${a.city} — ${a.pin}</p></div>`).join('')}
  <form data-f="addr" class="p-5 rounded-xl bg-white border border-brass/40 grid sm:grid-cols-2 gap-3"><h3 class="sm:col-span-2 font-semibold text-sm">Add new address</h3>
   <input required name="name" value="${esc(S.user.name)}" placeholder="Recipient name *"><input required name="phone" placeholder="Phone *" pattern="[0-9+ ]{10,15}">
   <input required name="street" placeholder="Street / landmark *" class="sm:col-span-2"><input name="city" placeholder="City"><input required name="pin" placeholder="Pincode *" pattern="[0-9]{6}">
   <button class="sm:col-span-2 px-4 py-2 rounded-lg bg-brass text-ink text-xs font-bold">Save Address</button></form></div>${summary(c,'Continue to Payment','pay1')}</div>`}
 else body=`<div class="max-w-xl mx-auto bg-white rounded-2xl border border-ink/15 overflow-hidden shadow-lg"><div class="bg-ink text-bone p-5"><p class="text-[10px] uppercase tracking-widest text-gold">Secure Checkout (demo — no real payment)</p><p class="text-xl font-bold">${inr(c.total)}</p></div><div class="p-6 space-y-3">
  ${[['UPI','UPI (GPay, PhonePe, Paytm)'],['CARD','Credit / Debit Card'],['NET_BANKING','Net Banking']].map(([k,l])=>`<div data-a="paym" data-x="${k}" class="p-4 rounded-xl border cursor-pointer text-sm font-bold ${S.pay===k?'border-brass bg-bone':'border-ink/15'}">${l}</div>`).join('')}
  <div class="pt-3 flex gap-3"><button data-a="step" data-x="1" class="px-4 py-3 rounded-xl border text-xs font-semibold">Back</button><button data-a="place" class="flex-1 py-3 rounded-xl bg-ink text-bone hover:bg-brass hover:text-ink font-bold text-sm">Place Order · ${inr(c.total)}</button></div></div></div>`;
 return `<main class="max-w-5xl mx-auto px-4 py-10"><div class="flex justify-center gap-3 mb-8">${steps}</div>${body}</main>`}
function summary(c,btn,act){return `<div class="bg-white p-5 rounded-xl border border-ink/12 h-fit space-y-3"><h3 class="serif text-lg">Order Summary</h3><div class="text-xs space-y-1 border-b pb-3"><div class="flex justify-between"><span>Subtotal (${c.count})</span><span>${inr(c.sub)}</span></div>${c.disc?`<div class="flex justify-between text-emerald-700 font-semibold"><span>Coupon ${S.coupon}</span><span>-${inr(c.disc)}</span></div>`:''}<div class="flex justify-between"><span>Shipping</span><span class="text-emerald-700 font-semibold">FREE</span></div></div><div class="flex justify-between font-bold"><span>Total</span><span>${inr(c.total)}</span></div><button data-a="${act}" class="w-full py-3 rounded-xl bg-ink text-bone hover:bg-brass hover:text-ink font-semibold text-sm">${btn}</button></div>`}

function orders(){if(!S.user)return '<main class="py-20 text-center"><button data-a="acct" class="px-5 py-2.5 rounded-xl bg-ink text-bone text-sm font-bold">Sign in to view your orders</button></main>';const mine=S.orders.filter(o=>o.mobile===S.user.mobile);return `<main class="max-w-4xl mx-auto px-4 py-10"><div class="bg-white rounded-xl border p-5 mb-6 flex flex-wrap justify-between gap-3 text-sm"><div><b>${esc(S.user.name)}</b> · ${S.user.age} yrs<p class="text-xs text-ink/60">+91 ${S.user.mobile} · ${esc(S.user.email)}</p></div><button data-a="logout" class="text-xs font-bold text-rose-700">Log out</button></div><h1 class="serif text-3xl mb-6">Order History (${mine.length})</h1>${mine.length?mine.map(o=>`<div class="bg-white rounded-xl border p-5 mb-4"><div class="flex flex-wrap justify-between gap-2 pb-3 border-b"><div><b class="text-sm">${o.id}</b> <span class="text-xs text-ink/55 ml-2">${o.at}</span></div><div class="flex items-center gap-3"><b>${inr(o.total)}</b><button data-a="invoice" data-x="${o.id}" class="px-3 py-1.5 rounded-lg bg-bone border border-brass/40 text-xs font-bold">Download Bill</button></div></div>

  <div class="bg-white p-5 rounded-xl border"><h3 class="serif text-lg mb-2">Low stock alerts</h3>${low.slice(0,12).map(({p,v})=>`<p class="text-xs py-1 flex justify-between"><span>${p.title} · ${v.color}</span><b class="text-amber-700">${v.stock} left</b></p>`).join('')}</div></div>`}

 if(S.atab==='products'){const f=S.pf,fv=k=>f?.v?.[k]||{};

 ${[0,1,2].map(k=>{const v=fv(k);return `<div class="grid grid-cols-2 sm:grid-cols-7 gap-2 items-center"><input name="c${k}" placeholder="Colour ${k+1}${k?'':' *'}" value="${esc(v.color||'')}"><input type="color" name="h${k}" value="${v.hex||'#1C1B29'}" class="!p-0 h-9 w-full"><input name="ph${k}" placeholder="Photo URL or Unsplash id" value="${esc(v.photo||'')}" class="col-span-2"><input name="m${k}" type="number" placeholder="MRP ₹" value="${v.mrp||''}"><input name="p${k}" type="number" placeholder="Price ₹" value="${v.price||''}"><input name="s${k}" type="number" placeholder="Stock" value="${v.stock??''}"></div>`}).join('')}

 <div class="bg-white rounded-xl border divide-y">${CL.map(c=>`<div class="p-4 flex flex-wrap justify-between gap-2 text-sm"><div><b>${esc(c.name)}</b> <span class="text-xs text-ink/60">HSN ${esc(c.hsn)} · ${P.filter(p=>p.cat===c.name).length} products</span></div><div class="space-x-3 text-xs"><button data-a="cedit" data-x="${esc(c.name)}" class="text-brass font-bold">Rename / Edit</button><button data-a="cdel" data-x="${esc(c.name)}" class="text-rose-600 font-bold">Delete</button></div></div>`).join('')}</div>`}

 if(S.atab==='coupons'){const f=S.kf,oc=COUP.find(c=>c.code===f?.old);

 <div class="grid sm:grid-cols-2 gap-4">${COUP.map((c,i)=>`<div class="bg-white p-4 rounded-xl border"><div class="flex justify-between items-center"><div><b class="text-sm">${esc(c.code)}</b><p class="text-xs text-ink/60">${c.type==='P'?c.val+'% off'+(c.max<1e9?' (max '+inr(c.max)+')':''):inr(c.val)+' off'} · Min ${inr(c.min)}</p></div><button data-a="ctog" data-x="${i}" class="px-3 py-1 rounded-full text-xs font-bold ${c.on?'bg-emerald-100 text-emerald-800':'bg-gray-200'}">${c.on?'Active':'Paused'}</button></div><div class="mt-3 space-x-3 text-xs"><button data-a="kedit" data-x="${esc(c.code)}" class="text-brass font-bold">Edit</button><button data-a="kdel" data-x="${esc(c.code)}" class="text-rose-600 font-bold">Delete</button></div></div>`).join('')||'<p class="text-sm">No coupons yet.</p>'}</div>`}

 sw:(x,y)=>{S.av[x]=+y;main()},
 add:x=>{const p=P.find(a=>a.id===x),v=av(p),c=S.cart.find(i=>i.pid===x&&i.vid===v.id);
  if(v.stock<1)return toast('Out of stock','e');if(c){if(c.q>=v.stock)return toast('Max stock reached','e');c.q++}else S.cart.push({pid:x,vid:v.id,q:1});sv();hdr();toast('Added to your Orayve bag')},
 wish:x=>{const i=S.wish.indexOf(x);i>-1?S.wish.splice(i,1):S.wish.push(x);sv();main();toast(i>-1?'Removed from wishlist':'Saved to wishlist')},
 onlyw:()=>{S.onlyW=!S.onlyW;S.view='store';S.page=1;main()},
 share:x=>{const u=location.href.split('#')[0]+'#'+x;navigator.clipboard?.writeText(u).catch(()=>{});toast('Share link copied')},
 drawer:()=>{S.drawer=!S.drawer;drawer()},
 qty:(x,y)=>{const[p,v]=x.split('|');const c=S.cart.find(i=>i.pid===p&&i.vid===v);if(!c)return;const pr=P.find(a=>a.id===p),st=pr.v.find(a=>a.id===v).stock;c.q=Math.min(c.q+ +y,st);S.cart=S.cart.filter(i=>i.q>0);sv();hdr();drawer()},
 coupon:()=>{const code=$('#cin').value.trim().toUpperCase(),c=COUP.find(c=>c.code===code&&c.on);if(!c)return toast('Invalid or inactive coupon','e');
  if(cd().sub<c.min)return toast('Minimum order '+inr(c.min)+' required','e');S.coupon=code;drawer();toast('Coupon '+code+' applied')},
 tocheckout:()=>{S.drawer=false;if(!S.user){S.auth='login';S.after=1;drawer();modal();return}S.view='checkout';S.step=1;S.addr=S.addrs.find(a=>a.m===S.user.mobile)?.id||null;drawer();main();scrollTo(0,0)},
 go:x=>{S.view=x;main();scrollTo(0,0)},
 addr:x=>{S.addr=x;main()},
 pay1:()=>{if(!S.addr)return toast('Select or add a delivery address','e');S.step=2;main()},
 step:x=>{S.step=+x;main()},
 paym:x=>{S.pay=x;main()},
 place:()=>{const c=cd(),a=S.addrs.find(a=>a.id===S.addr);if(!c.items.length||!a)return;const r=Math.floor(1e5+Math.random()*9e5),y=new Date().getFullYear();
  const o={mobile:S.user?.mobile,id:`ORD-${y}-${r}`,inv:`INV-${y}-${r}`,at:new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}),status:0,pay:S.pay,coupon:S.coupon,sub:c.sub,disc:c.disc,total:c.total,addr:a,
   items:c.items.map(i=>({title:i.p.title,cat:i.p.cat,color:i.v.color,sku:i.v.sku,hsn:i.p.hsn,price:i.v.price,qty:i.q}))};
  c.items.forEach(i=>{i.v.stock=Math.max(0,i.v.stock-i.q);i.p.sold+=i.q});
  S.orders.unshift(o);svp();S.cart=[];S.coupon='';S.last=o;S.step=3;sv();main();toast('Order '+o.id+' confirmed!')},
 invoice:x=>{S.inv=S.orders.find(o=>o.id===x);modal()},closeinv:()=>{S.inv=null;modal()},
 atab:x=>{S.atab=x;main()},alogout:()=>{S.adm=false;S.view='store';main()},
 ctog:x=>{COUP[+x].on=!COUP[+x].on;svp();main()},
 acct:()=>{if(S.user)A.go('orders');else{S.auth='login';modal()}},
 authtab:x=>{S.auth=x;modal()},closeauth:()=>{S.auth=null;S.after=0;modal()},
 otp:()=>toast('Demo OTP: 123456'),
 logout:()=>{S.user=null;sv();S.view='store';main();toast('Logged out')},
 pnew:()=>{S.pf={};main();scrollTo(0,0)},pedit:x=>{S.pf=P.find(p=>p.id===x);main();scrollTo(0,0)},pcancel:()=>{S.pf=null;main()},
 pdel:x=>{if(!confirm('Delete this product?'))return;P.splice(P.findIndex(p=>p.id===x),1);S.cart=S.cart.filter(c=>c.pid!==x);S.wish=S.wish.filter(w=>w!==x);sv();svp();main();toast('Product deleted')},
 cnew:()=>{S.cf={};main()},cedit:x=>{S.cf={old:x};main()},ccancel:()=>{S.cf=null;main()},
 cdel:x=>{if(P.some(p=>p.cat===x))return toast('Delete or move its products first','e');if(!confirm('Delete category '+x+'?'))return;CL=CL.filter(c=>c.name!==x);if(S.cat===x)S.cat='All Categories';svp();main();toast('Category deleted')},
 unew:()=>{S.uf={};main()},uedit:x=>{S.uf={old:x};main()},ucancel:()=>{S.uf=null;main()},
 uban:x=>{const u=S.users.find(u=>u.mobile===x);if(!u)return;const b=!u.banned;
  if(!confirm(b?`Ban ${u.name} (${u.mobile})?\n\nThey will be signed out and cannot log in or place orders until you unban them.`:`Unban ${u.name} (${u.mobile})?\n\nThey will be able to log in again.`))return;
  u.banned=b;if(b&&S.user?.mobile===x)S.user=null;sv();hdr();main();toast(b?'User banned':'User unbanned')},
 udel:x=>{const u=S.users.find(u=>u.mobile===x);if(!u||!confirm(`Permanently delete ${u.name} (${x})?\n\nTheir saved addresses are removed; past orders are kept.`))return;
  S.users=S.users.filter(a=>a.mobile!==x);S.addrs=S.addrs.filter(a=>a.m!==x);if(S.user?.mobile===x)S.user=null;sv();hdr();main();toast('User deleted')},
 knew:()=>{S.kf={};main()},kedit:x=>{S.kf={old:x};main()},kcancel:()=>{S.kf=null;main()},
 kdel:x=>{if(!confirm('Delete coupon '+x+'?'))return;const i=COUP.findIndex(c=>c.code===x);if(i>-1)COUP.splice(i,1);if(S.coupon===x)S.coupon='';svp();main();toast('Coupon deleted')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.x,t.dataset.y)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;
 if(c==='color'){S.color=t.value;S.page=1;main()}
 if(c==='sort'){S.sort=t.value;S.page=1;main()}
 if(c==='status'){const o=S.orders.find(o=>o.id===t.dataset.x);o.status=+t.value;sv();toast('Order status updated')}
 if(c==='aprice'||c==='astock'){const v=P.find(p=>p.id===t.dataset.x).v[0];if(c==='aprice')v.price=+t.value;else v.stock=+t.value;toast('Product updated')}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.q=t.value;S.page=1;S.view='store';main()}
 if(t.dataset.c==='asearch'){S.aq=t.value;$('#atbl').innerHTML=atbl()}});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
 if(f==='addr'){const a={m:S.user.mobile,id:'a'+Date.now(),name:d.name,phone:d.phone,street:d.street,city:d.city||'Pune',pin:d.pin};S.addrs.push(a);S.addr=a.id;sv();main();toast('Address saved')}
 if(f==='login'||f==='reg'){const m=d.mobile.trim();if(d.otp!=='123456')return toast('Invalid OTP (demo OTP: 123456)','e');const u=S.users.find(u=>u.mobile===m);
 if(f==='login'){if(!u)return toast('No account found — please register','e');if(u.banned)return toast('This account has been banned. Please contact support.','e');S.user=u}
 else{if(u)return toast('Mobile already registered — please login','e');if(S.users.some(x=>x.email.toLowerCase()===d.email.trim().toLowerCase()))return toast('Email already in use','e');const nu={name:d.name.trim(),age:+d.age,email:d.email.trim(),mobile:m,at:new Date().toLocaleDateString('en-IN')};S.users.push(nu);S.user=nu}
 S.auth=null;sv();render();toast('Welcome, '+S.user.name.split(' ')[0]);if(S.after){S.after=0;A.tocheckout()}}
 if(f==='prod'){const id=S.pf?.id,old=id&&P.find(p=>p.id===id),pid=id||'p'+Date.now();
  const vs=[0,1,2].map(k=>({k,c:(d['c'+k]||'').trim(),h:d['h'+k],ph:(d['ph'+k]||'').trim(),mrp:+d['m'+k],pr:+d['p'+k],st:+d['s'+k]})).filter(x=>x.c&&x.pr>0);
  if(!vs.length)return toast('Add at least one colour with a price','e');
  const v=vs.map(x=>{const mrp=Math.max(x.mrp||x.pr,x.pr),vid=pid+'v'+x.k;return{id:vid,sku:old?.v.find(o=>o.id===vid)?.sku||`ORV-${d.cat.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()}-${Math.floor(100+Math.random()*900)}-${x.k+1}`,color:x.c,hex:x.h,photo:x.ph,mrp,d:Math.round((1-x.pr/mrp)*100),price:x.pr,stock:Math.max(0,x.st||0)}});
  const np={id:pid,title:d.title.trim(),cat:d.cat,design:(d.design||'').trim()||'Classic',hsn:CL.find(c=>c.name===d.cat)?.hsn||'',rate:old?.rate||4.5,rev:old?.rev||0,views:old?.views||0,sold:old?.sold||0,coupon:!!d.coupon,v};
  if(old)P[P.indexOf(old)]=np;else P.unshift(np);S.pf=null;svp();main();toast(old?'Product updated':'Product added')}
 if(f==='cat'){const nm=d.name.trim(),old=S.cf?.old;if(CL.some(c=>c.name.toLowerCase()===nm.toLowerCase()&&c.name!==old))return toast('Category already exists','e');
  if(old){const c=CL.find(c=>c.name===old);P.forEach(p=>{if(p.cat===old){p.cat=nm;p.hsn=d.hsn.trim()}});if(S.cat===old)S.cat=nm;c.name=nm;c.hsn=d.hsn.trim()}else CL.push({name:nm,hsn:d.hsn.trim()});
  S.cf=null;svp();main();toast('Category saved')}
 if(f==='user'){const old=S.uf?.old,m=d.mobile.trim(),em=d.email.trim().toLowerCase();
  if(S.users.some(u=>u.mobile===m&&u.mobile!==old))return toast('Mobile already registered','e');
  if(S.users.some(u=>u.email.toLowerCase()===em&&u.mobile!==old))return toast('Email already in use','e');
  if(old){const u=S.users.find(u=>u.mobile===old);Object.assign(u,{name:d.name.trim(),age:+d.age,email:d.email.trim(),mobile:m});
   if(m!==old){S.orders.forEach(o=>{if(o.mobile===old)o.mobile=m});S.addrs.forEach(a=>{if(a.m===old)a.m=m})}if(S.user?.mobile===old)S.user=u}
  else S.users.push({name:d.name.trim(),age:+d.age,email:d.email.trim(),mobile:m,at:new Date().toLocaleDateString('en-IN')});
  S.uf=null;sv();hdr();main();toast('User saved')}
 if(f==='coup'){const old=S.kf?.old,code=d.code.trim().toUpperCase().replace(/\s+/g,''),val=+d.val;
  if(!/^[A-Z0-9]{3,20}$/.test(code))return toast('Code must be 3–20 letters/numbers','e');
  if(COUP.some(c=>c.code===code&&c.code!==old))return toast('Coupon code already exists','e');
  if(!(val>0)||(d.type==='P'&&val>100))return toast('Invalid discount value','e');
  const c={code,type:d.type,val,max:d.type==='P'?(+d.max||1e9):val,min:+d.min||0,on:!!d.on};
  if(old)COUP[COUP.findIndex(x=>x.code===old)]=c;else COUP.push(c);if(S.coupon===old)S.coupon=old===code?code:'';
  S.kf=null;svp();main();toast('Coupon saved')}
 if(f==='adm'){if(d.p===ADMIN_PASS){S.adm=true;main();toast('Admin console unlocked')}else toast('Wrong passcode','e')}});
render();
</script>
</body>
